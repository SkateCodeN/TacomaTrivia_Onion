name: Tacoma-Trivia-containers
services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: postgres:latest
    container_name: TacomaTrivia-Venue-Postgres-DB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/17/docker
    volumes:
      - venue-pg-data:/var/lib/postgresql
    ports:
      - "9000:5432"

volumes:
  pgdata: