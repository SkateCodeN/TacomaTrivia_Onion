name: dev-azure-deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

# ──────────────────────────────────────────────
# 1) Unit tests (ubuntu, no infra needed)
# ──────────────────────────────────────────────
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit Tests
        run: dotnet test ./TacomaTrivia.UnitTests/TacomaTrivia.UnitTests.csproj -c Release -v minimal

# ──────────────────────────────────────────────
# 2) Integration tests
# ──────────────────────────────────────────────
  # integration:
  #   runs-on: ubuntu-latest
  #   needs: unit
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: actions/setup-dotnet@v4
  #       with:
  #         dotnet-version: '8.0.x'

  #     - name: Integration Tests
  #       run: dotnet test ./TacomaTrivia.IntegrationTests/TacomaTrivia.IntegrationTests.csproj -c Release -v minimal

# ──────────────────────────────────────────────
# 3) Build frontend + backend → Docker → ACR → Container App
# ──────────────────────────────────────────────
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [unit]
    permissions:
      id-token: write   # Required for OIDC Azure login
      contents: read

    steps:
      - uses: actions/checkout@v4

      # --- Frontend build ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Create wwwroot
        run: mkdir -p ./TacomaTrivia.Api/wwwroot

      - name: Install frontend dependencies
        working-directory: ./tacomatrivia-frontend
        run: npm ci

      - name: Build Vite frontend into API wwwroot
        working-directory: ./tacomatrivia-frontend
        run: npm run build -- --outDir ../TacomaTrivia.Api/wwwroot

      # --- Backend publish ---
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET API
        run: |
          mkdir -p ./publish/Api
          dotnet restore ./TacomaTrivia.Api/TacomaTrivia.Api.csproj
          dotnet publish ./TacomaTrivia.Api/TacomaTrivia.Api.csproj \
            -c Release \
            -o ./publish/Api

      # Sanity check — fail fast if wwwroot didn't make it into publish output
      - name: Verify wwwroot present in publish
        run: |
          if [ ! -f ./publish/Api/wwwroot/index.html ]; then
            echo "ERROR: wwwroot/index.html missing from publish output"
            find ./publish/Api -type f | head -40
            exit 1
          fi
          echo "wwwroot/index.html found — publish looks good"

      # --- Azure login ---
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TTAPPCOTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TTAPPCOTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TTAPPCOTAINER_AZURE_SUBSCRIPTION_ID }}

      # --- Build & push to ACR ---
        # added acr in gui and the secret name in github
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/tacomatrivia:dev-${{ github.sha }}
          docker build \
            -t $IMAGE \
            -f ./TacomaTrivia.Api/Dockerfile.runtime .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

        # connect to ACR via credentials
      - name: Set ACR credentials on Container App
        run: |
          az containerapp registry set \
            --name tt-app-cotainer \
            --resource-group TestingResourceGroup \
            --server ${{ secrets.ACR_NAME }}.azurecr.io \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      # --- Deploy to Container App ---
      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name tt-app-cotainer \
            --resource-group TestingResourceGroup \
            --image ${{ env.IMAGE }} \
            --set-env-vars "ASPNETCORE_URLS=http://+:8080"
        