name: Trigger auto deployment for tt-app-cotainer

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/tt-app-cotainer-AutoDeployTrigger-dc87e084-60f7-495e-98fc-3c5b8278b9b0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TTAPPCOTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TTAPPCOTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TTAPPCOTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.TTAPPCOTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TTAPPCOTAINER_REGISTRY_PASSWORD }}
          containerAppName: tt-app-cotainer
          resourceGroup: TestingResourceGroup
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


